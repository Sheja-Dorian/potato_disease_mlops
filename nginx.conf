events { worker_connections 4096; }
http {
  client_max_body_size 200m;
  # Docker DNS returns one IP per scaled "api" replica; nginx round-robins across all of them.
  # Restart lb after changing the scale:  docker compose restart lb
  upstream api_pool { server api:8000; keepalive 64; }
  server {
    listen 80;
    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 600s;
    }
  }
}
